name: opentui-pin

# Guards the per-branch OpenTUI pin (script/check-opentui-pin.ts). The v1 line and
# the v2 line pin different OpenTUI releases, so this job fails when the catalog,
# the overrides and bun.lock stop agreeing, or when the pin of the other line leaks
# in through a merge. Add --strict to also fail on the unpinned native platform
# packages, and --remote to require the release assets to answer HTTP 200.
#
# Deliberately no `bun install` here: a non-frozen install would repair bun.lock
# instead of reporting that it diverged from the manifests.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Check the OpenTUI pin
        run: bun run script/check-opentui-pin.ts
