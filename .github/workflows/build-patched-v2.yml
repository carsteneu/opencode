name: build-patched-v2

# Builds — and optionally publishes — a patched fork prerelease for Linux x64.
#
# The pipeline deliberately owns no release logic. The guards, the artifact
# verification, the version check, the draft verification, the checksum round-trip and
# the publish step all live in the repository (packages/cli/script/patched-release.ts
# and patched-release-plan.ts) and the channel contract lives in
# packages/util/src/installation/fork-release.ts, so the tag shape, the ordering rule
# and the asset names cannot drift between the pipeline and the updater. This file only
# decides which of those entry points runs; the two constants it does carry — the
# release repository and the release branch — are the ones it has to compare itself
# against, and the branch is handed to the script as its documented override.
#
# Publishing route, the normal one: push the release tag.
#
#   git tag 2.0.26-patched.4 && git push fork 2.0.26-patched.4
#
# GitHub takes this file from the tagged commit, so the tag has to be on a commit that
# already carries it, and the tagged commit is what gets built. The tag names the version
# and the run publishes it; the version is not an input on this route and the branch
# constant plays no part, because a tag push checks out a detached HEAD and the tag stands
# in for the branch as the release identity (patched-release-plan.ts).
#
# The tag filter is a GitHub glob, not a regex, and it cannot express the major version,
# so the frozen 1.x tags (1.18.34-patched.n) match it as well. Such a run can only happen
# if this file exists at that tag, which the 1.x line does not carry; should one appear,
# the plan refuses it before anything is built, because both lines share one channel and a
# 2.x release outranks every 1.x release — the same rule that keeps the frozen line from
# publishing while a 2.x release is the newest entry.
#
# A publish run that dies after it created the draft leaves the draft behind: the next
# run resumes a draft that belongs to the same release and refuses one that does not
# (patched-release-plan.ts). Re-run a failed run with `gh run rerun <run-id>`, which
# reuses the ref it was triggered from, and on the tag route re-checks that the tag still
# points at the commit being built. Clear a stale draft before re-running that version:
#
#   gh release delete <version> --repo carsteneu/opencode --yes
#
# No --cleanup-tag on the publishing route: the tag there is what triggers the run, so
# deleting it costs the run its own ref. The manual route is the case that needs it — gh
# creates the tag itself there and the script refuses to reuse one that is already on the
# fork, so a manual re-run after deleting the release has to delete the tag as well:
#
#   gh release delete <version> --repo carsteneu/opencode --cleanup-tag --yes
#
# Manual route, for a build without publishing and for a hand-run release:
#
#   gh workflow run build-patched-v2.yml --repo carsteneu/opencode --ref v2-ci-release \
#     -f version=2.0.26-patched.4 -f publish=true
#
# GitHub resolves a dispatch by filename against the default branch, so this file has to
# exist on `dev` as well as on the ref it runs against; the dispatch route stays usable
# only while that copy is kept in step with this one.
#
# publish defaults to false, the path that touches no shared state: the job builds,
# verifies and uploads the action artifact but creates no release. The checksum
# round-trip belongs to the publishing path and runs there, inside the script. A dispatch
# from any other ref than the release branch is refused by the guard below — including a
# dispatch pointed at a tag, which would otherwise look like the publishing route.
#
# The manual route builds the release branch, so after a publishing run (which builds the
# tagged commit and does not touch any branch) that branch has to be fast-forwarded to the
# published tag before it is used again; otherwise the next manual release would publish
# the older code under a higher version number.

run-name: build patched ${{ github.event_name == 'push' && github.ref_name || inputs.version }} (publish=${{ github.event_name == 'push' || inputs.publish }})

on:
  push:
    tags:
      - "*-patched.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Patched version to build, e.g. 2.0.26-patched.4"
        required: true
        type: string
      publish:
        description: "true = create the draft release, verify the checksum round-trip and publish it"
        required: false
        type: boolean
        default: false

# Baseline for any job added later: the job below replaces it with the write access the
# publishing path needs.
permissions:
  contents: read

jobs:
  build-patched:
    name: Build patched OpenCode (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      # patched-release-plan.ts refuses --publish from any other branch, and the guard
      # below refuses a dispatch from any other ref. Move this constant together with the
      # release branch of the v2 line.
      OPENCODE_RELEASE_BRANCH: v2-ci-release
      # The two values every step below acts on, resolved once. The event decides the route,
      # not the ref type: a dispatch can be pointed at a tag (`gh workflow run --ref <tag>`)
      # and must not be mistaken for the publishing route, and a tag push neither carries
      # inputs nor needs them. No step has to ask which event it came from.
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    # One group for the whole workflow: two runs of THIS workflow that both publish must
    # not overlap, because the "newer than the newest published" rule is checked before
    # the build and the channel changes only at the publish step (patched-release.ts
    # re-reads it, but not atomically). The group serializes this workflow only — the 1.x
    # matrix workflow carries its own group and can be dispatched to the same channel
    # independently. A run queued behind another can be displaced; for a publishing
    # pipeline serialization is the safer side of that trade.
    concurrency:
      group: build-patched-v2
      cancel-in-progress: false
    steps:
      - name: Assert the release repository and ref
        # Runs before checkout and before any dependency install, so a tag that this
        # repository does not build or a dispatch from a feature branch costs nothing.
        # carsteneu/opencode is a guard against building in the wrong repository here; the
        # authoritative repository constant stays ForkRelease.repository in the contract.
        run: |
          set -euo pipefail
          if [ "$GITHUB_REPOSITORY" != "carsteneu/opencode" ]; then
            echo "This workflow builds and publishes only from carsteneu/opencode, not $GITHUB_REPOSITORY"
            exit 1
          fi
          case "$VERSION" in
            *[[:space:]]*) echo "version must not contain whitespace"; exit 1 ;;
          esac
          # The full ref decides the route, not the short name: a tag called like the
          # release branch must not pass as that branch. On a tag push the version comes
          # from the tag itself, so the run and the tag can never disagree; a dispatch keeps
          # its documented input.
          case "$GITHUB_REF" in
            refs/tags/*)
              # Only a push may publish from a tag. A dispatch can be pointed at a tag ref
              # as well, and reading that as the publishing route would ignore the inputs
              # and override the publish opt-in, which is exactly what the dispatch route
              # exists to avoid.
              if [ "$GITHUB_EVENT_NAME" != "push" ]; then
                echo "A dispatch is not a publishing route whatever its ref says; dispatch on refs/heads/$OPENCODE_RELEASE_BRANCH"
                exit 1
              fi
              # The contract's tag pattern tolerates a leading v, but everything the release
              # does with a tag uses the bare name: the fork tag it binds to the commit, the
              # release it creates and the tag name it verifies afterwards. Refuse that form
              # here, before anything is built, rather than after the build in that lookup.
              if [ "${VERSION#v}" != "$VERSION" ]; then
                echo "Tag the release without the v prefix, not $VERSION"
                exit 1
              fi
              echo "Tag push: building and publishing $VERSION"
              ;;
            refs/heads/"$OPENCODE_RELEASE_BRANCH")
              echo "Dispatch on $OPENCODE_RELEASE_BRANCH: building $VERSION with publish=$PUBLISH"
              ;;
            *)
              echo "Push a release tag, or dispatch this workflow on refs/heads/$OPENCODE_RELEASE_BRANCH, not $GITHUB_REF"
              exit 1
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # No credential in the workspace: the release branch push gets its token from
          # the fork remote below, so the dependency install that follows runs without.
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Add the fork remote
        # Only the publishing path touches the remote: with publish=false the script
        # exits before it reaches the `fork` remote (the git calls before that point are
        # local reads, patched-release.ts:52-60 vs the exit at :153-155). On the tag route
        # the remote is read before the draft is created, to bind the pushed tag to the
        # checked-out commit; on the manual route it is pushed to. GH_TOKEN enters the
        # environment only for this step; the credential it writes lives in .git/config for
        # the rest of the job because the later push and ls-remote depend on it, and the
        # remote URL itself stays token-free.
        if: ${{ env.PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote add fork "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local "http.https://github.com/.extraheader" \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"

      - name: Build, verify and publish
        working-directory: packages/cli
        # A repository-write credential is set only where it is used: this step calls gh,
        # the fork remote above needs it for the git push. On the default path the script
        # never reaches gh (patched-release.ts:75-76), so the token is empty there. The
        # inputs go in through the environment rather than into shell source.
        env:
          GH_TOKEN: ${{ env.PUBLISH == 'true' && github.token || '' }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = "true" ]; then
            bun run release:patched "$VERSION" --publish
          else
            bun run release:patched "$VERSION"
          fi

      - name: Upload patched binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: patched-binaries-${{ env.VERSION }}
          path: packages/cli/dist/patched-release/
          if-no-files-found: error
